name: Docker GHCR

# Publica la imagen Docker del sistema en GitHub Container Registry.
# - Al crear/empujar un tag vX.Y.Z construye y publica ghcr.io/<owner>/sgroas:vX.Y.Z
# - Tambien se puede ejecutar manualmente (workflow_dispatch) para una rama.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de la imagen a publicar (opcional; por defecto vX.Y.Z del tag o sha de la rama)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency: docker-ghcr
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute tag
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            echo "TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/sgroas:${{ steps.meta.outputs.TAG }}